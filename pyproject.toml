[project]
name = "openaec_bouw"
authors = [{ name = "OpenAEC Studio BV", email = "openaecstudio@gmail.com" }]
description = "OpenAEC-inrichting van ERPNext voor de bouw: modules met stamgegevens die aan en uit kunnen"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
